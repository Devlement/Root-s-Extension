<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Amazon Rootine</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        
        <!-- EN-TÊTE AVEC IMAGE -->
        <div class="logo-container">
            <img src="assets/Amazon rootine.png" alt="Amazon Rootine" class="logo-img">
        </div>

        <!-- NOUVEAU PLACEMENT : Interrupteur global toujours visible -->
        <div class="toggle-container" style="margin-top: 0; margin-bottom: 24px;">
            <span class="toggle-label">Mode Balade</span>
            <label class="switch">
                <input type="checkbox" id="summon-toggle">
                <span class="slider round"></span>
            </label>
        </div>

        <!-- ÉCRAN 1 : Message d'avertissement (Hors Amazon) -->
        <div id="not-amazon-screen" class="error-card hidden">
            <div class="error-icon">🛒</div>
            <h2 class="error-title">Hors zone de confort</h2>
            <p class="error-text">Root est programmé exclusivement pour analyser les offres sur le catalogue Amazon.</p>
            <a href="https://www.amazon.fr" target="_blank" class="btn-secondary">Rejoindre Amazon</a>
        </div>

        <!-- ÉCRAN 2 : Interface principale de l'extension (Sur Amazon) -->
        <div id="amazon-screen" class="w-full hidden">
            <div class="section-title">Comportement de l'assistant</div>
            <div class="strategy-grid">
                <div>
                    <input type="radio" id="cheapest" name="strategy" value="cheapest" checked>
                    <label for="cheapest">Le moins cher</label>
                </div>
                <div>
                    <input type="radio" id="median" name="strategy" value="median">
                    <label for="median">Prix médian</label>
                </div>
                <div>
                    <input type="radio" id="expensive" name="strategy" value="expensive">
                    <label for="expensive">Le plus cher</label>
                </div>
                <div>
                    <input type="radio" id="best_rated" name="strategy" value="best_rated">
                    <label for="best_rated">Le mieux noté</label>
                </div>
            </div>

            <div class="section-title">Filtres de recherche avancés</div>
            <div class="options-container">
                <label class="checkbox-item">
                    <input type="checkbox" id="opt-prime" checked>
                    <span>Livraison Prime uniquement</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="opt-nosponsor" checked>
                    <span>Ignorer les offres "Sponsorisées"</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="opt-stars">
                    <span>Sélection 4 étoiles et plus</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="opt-soldbyamz">
                    <span>Vendu et expédié par Amazon</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="opt-new">
                    <span>Articles strictement neufs</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="opt-basics">
                    <span>Amazon Basics <span class="badge-beta">BETA</span></span>
                </label>
            </div>

            <button id="rescan-btn" class="btn-primary" style="margin-top: 16px;">Lancer votre rootine amazon</button>
        </div>

    </div>
    <script src="popup.js"></script>
</body>
</html>
