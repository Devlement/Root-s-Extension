<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Root</title>
    <style>
        :root {
            --bg: #f5f6f7;
            --card: #ffffff;
            --accent: #b8860b;
            --text: #0f1720;
            --muted: #6b7280;
        }
        body {
            width: 360px;
            margin: 0;
            padding: 18px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
        }
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(15, 23, 32, 0.06);
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .avatar-container {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--accent), #ff8c00);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 18px rgba(15, 23, 32, 0.06);
            overflow: hidden;
        }
        .avatar-container img { width: 28px; height: 28px; }
        .title { font-size: 18px; font-weight: 700; margin: 0; }
        .subtitle { font-size: 12px; color: var(--muted); }

        .description { text-align: center; margin: 18px 8px; color: var(--muted); font-size: 13px; line-height: 1.4; }

        .controls { display: flex; flex-direction: column; gap: 12px; }
        .strategy-selector { display: flex; gap: 8px; }
        .strategy-selector input { display: none; }
        .strategy-selector label {
            flex: 1; text-align: center; padding: 8px 10px; border-radius: 8px;
            background: #f3f4f6; color: var(--muted); cursor: pointer; font-weight: 600; font-size: 13px;
            border: 1px solid transparent;
        }
        .strategy-selector input:checked + label { background: var(--accent); color: white; }

        .btn-action { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--text); color: white; font-weight: 700; cursor: pointer; }

        .footer { text-align: center; margin-top: 12px; font-size: 12px; color: var(--muted); }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="avatar-container">
                <img src="assets/icon48.png" alt="Root">
            </div>
            <div>
                <h1 class="title">Root</h1>
                <div class="subtitle">Analyse de la page</div>
            </div>
        </div>

        <div class="description">Root analyse et compare automatiquement les produits présents sur cette page pour vous aider à trouver la meilleure option rapidement.</div>

        <div class="controls">
            <div class="strategy-selector">
                <input type="radio" id="cheapest" name="strategy" value="cheapest" checked>
                <label for="cheapest">Moins cher</label>

                <input type="radio" id="median" name="strategy" value="median">
                <label for="median">Médiane</label>

                <input type="radio" id="expensive" name="strategy" value="expensive">
                <label for="expensive">Plus cher</label>
            </div>

            <button id="rescan-btn" class="btn-action">Chercher le produit</button>
        </div>

        <div class="footer">Version 1.0 • © Root • Fait avec ❤️ par Devlément</div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
